<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d2340">
  <meta name="description" content="Dallas–Fort Worth news dashboard for Texas News Roundup">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>Texas News Roundup — DFW Desk</title>
</head>
<body>
<header>
  <div>
    <div class="brand">TEXAS NEWS ROUNDUP</div>
    <h1>DFW News Desk</h1>
    <p id="updated">Loading the latest stories…</p>
  </div>
  <button id="refreshBtn" class="icon-btn" aria-label="Refresh">↻</button>
</header>

<div class="notice">
  Review every story before posting. Open the original source to confirm details and image-use rights.
</div>

<nav id="categories" aria-label="Story categories"></nav>

<section class="tools">
  <input id="search" type="search" placeholder="Search Dallas–Fort Worth news">
  <select id="sort">
    <option value="newest">Newest first</option>
    <option value="oldest">Oldest first</option>
  </select>
</section>

<main id="feed">
  <div class="loading">Collecting stories…</div>
</main>

<div id="toast" role="status"></div>

<template id="storyTemplate">
  <article class="card">
    <img class="thumb" alt="" loading="lazy">
    <div class="body">
      <div class="topline">
        <span class="category"></span>
        <span class="time"></span>
      </div>
      <h2></h2>
      <p class="summary"></p>
      <div class="source"></div>
      <details>
        <summary>Facebook caption</summary>
        <textarea class="caption" rows="8"></textarea>
      </details>
      <div class="actions">
        <button class="copy primary">Copy caption</button>
        <button class="share">Share</button>
        <a class="open" target="_blank" rel="noopener">Open original</a>
        <button class="posted">Mark posted</button>
      </div>
    </div>
  </article>
</template>

<script src="app.js"></script>
</body>
</html>
